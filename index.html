<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populus Web</title>
    <!-- Carrega a biblioteca do CheerpJ -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3load.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #status {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div id="status">⏳ Carregando o Java e o Populus... Aguarde alguns segundos.</div>

    <script>
        (async () => {
            // Inicializa o motor do Java no navegador
            await cheerpjInit();
            // Cria a janela onde o Populus vai aparecer
            cheerpjCreateDisplay(1024, 768);
            // Executa o arquivo exato que você enviou
            await cheerpjRunJar("/app/PopulusAll_Jan_2018.jar");
            // Esconde a mensagem de carregamento quando o programa abrir
            document.getElementById('status').style.display = 'none';
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populus Web</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #444;
        }
        #app-container {
            width: 100%;
            max-width: 1024px;
            height: 768px;
            margin: 0 auto;
            border: 1px solid #555;
            background-color: #000;
        }
    </style>

    <!-- Carrega a biblioteca do CheerpJ -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3load.js"></script>
</head>
<body>
    <div id="status">⏳ Baixando componentes do Java... Aguarde (V2.0).</div>
    <div id="app-container"></div>

    <script>
        async function iniciarPopulus() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "⏳ Inicializando ambiente Java...";
                
                // 1. Inicializa o CheerpJ
                await cheerpjInit();
                
                // 2. Define o container onde a tela do programa vai aparecer
                const container = document.getElementById('app-container');
                cheerpjCreateDisplay(1024, 768, container);
                
                statusEl.innerText = "⏳ Abrindo o Populus... (pode levar até 30s na primeira vez)";

                // 3. Executa o arquivo .jar enviado ao GitHub
                await cheerpjRunJar("/app/PopulusAll_Jan_2018.jar");
                
                statusEl.style.display = 'none';
            } catch (err) {
                statusEl.style.color = '#ff6b6b';
                statusEl.innerText = "❌ Erro ao carregar: " + err.message;
            }
        }

        // Garante que a biblioteca foi totalmente baixada antes de executar
        window.addEventListener('load', function() {
            if (typeof cheerpjInit !== "undefined") {
                iniciarPopulus();
            } else {
                document.getElementById('status').innerText = "❌ Falha ao baixar a biblioteca do CheerpJ. Verifique a conexão.";
            }
        });
    </script>
</body>
</html>

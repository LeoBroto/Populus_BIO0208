<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populus Web</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #444;
            max-width: 90%;
            line-height: 1.5;
        }
        #app-container {
            width: 100%;
            max-width: 1024px;
            height: 768px;
            margin: 0 auto;
            border: 1px solid #555;
            background-color: #000;
        }
    </style>
</head>
<body>
    <div id="status">⏳ Conectando aos servidores do Java... Aguarde.</div>
    <div id="app-container"></div>

    <script>
        async function rodarPopulus() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "⏳ Inicializando Java no navegador...";
                
                // CORREÇÃO: Apontando a raiz do documento para a pasta do repositório
                await cheerpjInit({
                    overrideDocumentBase: "https://leobroto.github.io/Populus_BIO0208/"
                });
                
                const container = document.getElementById('app-container');
                cheerpjCreateDisplay(1024, 768, container);
                
                statusEl.innerText = "⏳ Carregando o Populus (PopulusAll_Jan_2018.jar)...";
                await cheerpjRunJar("/app/Populus_BIO0208/PopulusAll_Jan_2018.jar");
                
                statusEl.style.display = 'none';
            } catch (err) {
                statusEl.style.color = '#ff6b6b';
                statusEl.innerText = "❌ Erro ao executar o Populus (V0.5): " + err.message;
            }
        }

        function falhaDownload() {
            const statusEl = document.getElementById('status');
            statusEl.style.color = '#ff6b6b';
            statusEl.innerHTML = "❌ O navegador bloqueou o carregamento da biblioteca Java.<br><br>" +
                "<b>Como resolver no tablet:</b><br>" +
                "1. Desative a 'Proteção contra rastreamento' ou o 'Bloqueador de Anúncios/Brave Shield' neste site.<br>" +
                "2. Se estiver no Edge ou Chrome, verifique se a extensão/configuração de segurança não bloqueou conexões externas.";
        }
    </script>

    <!-- O evento onload garante que o código só roda após o arquivo carregar 100% -->
    <script src="https://cjrtnc.leaningtech.com/3.1/cj3loader.js" onload="rodarPopulus()" onerror="falhaDownload()"></script>
</body>
</html>
